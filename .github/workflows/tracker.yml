name: GTA 6 Tracker

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay busy-hour runs by a few minutes)
  workflow_dispatch:          # lets you press "Run workflow" manually

permissions:
  contents: write
  pages: write
  id-token: write

# never let two runs overlap
concurrency:
  group: gta6-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tracker.py

      - name: Save state (so you don't get repeats)
        run: |
          git config user.name "gta6-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json state.json latest_report.md docs
          git diff --cached --quiet && exit 0
          git commit -m "Update tracker state" -q
          git pull --rebase -q || true
          git push -q

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish web page
        id: deployment
        uses: actions/deploy-pages@v4
